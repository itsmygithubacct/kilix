# kilix — kitty made to look & behave like Tilix
# Loaded by ../kilix, which runs the forked kitty in ../src (kitty.app is the fallback; >= 0.47).
# Requires kitty >= 0.47 for per-pane title bars (window_title_bar).

#: ── Tilix-style per-pane title bars ─────────────────────────────
# Each pane gets a header bar (like Tilix) with synchronized-input, split,
# maximize, and close buttons (the fork's feature); the keymaps below are the
# keyboard equivalents.
window_title_bar               top
window_title_bar_min_windows   1
window_title_template          " {fmt.fg.red}{bell_symbol}{fmt.fg.yellow}{activity_symbol}{fmt.fg.window}{title} "
active_window_title_template    " ▎{fmt.fg.red}{bell_symbol}{fmt.fg.yellow}{activity_symbol}{fmt.fg.window}{title} "
window_title_bar_align         left
# Tilix-style active-pane cue: bright active header, grayed inactive header
window_title_bar_active_background     #3465a4
window_title_bar_active_foreground     #ffffff
window_title_bar_inactive_background   #2e3436
window_title_bar_inactive_foreground   #8a8a8a
# kilix fork: pin the pane-button Nerd Font glyphs to the bundled font.
# F030C keyboard (synchronized input), F0731 ← split-left, F0737 ↑ split-up,
# F072E ↓ split-down, F0734 → split-right,
# EAB9 □ maximize (tiled) / F0293 ⛶ maximize (state cue), F0156 ✕ close,
# F2C9 thermometer, F028 volume (click to open the mixer), F073 calendar,
# F1EB Wi-Fi/network.
# F05CB speaking head (click to read the pane aloud), F036C microphone
# (click to dictate) / F036D muted microphone when dictation is unavailable.
# F0079-F0083 battery levels for the draining laptop indicator.
symbol_map U+EAB9,U+F0156,U+F028,U+F2C9,U+F0293,U+F030C,U+F035B,U+F036C,U+F036D,U+F05CB,U+F073,U+F1EB,U+F072E,U+F0731,U+F0734,U+F0737,U+F0079,U+F007A,U+F007B,U+F007C,U+F007D,U+F007E,U+F007F,U+F0080,U+F0081,U+F0082,U+F0083 Symbols Nerd Font Mono

#: ── Tiling like Tilix ───────────────────────────────────────────
# splits first => it's the default layout, so vsplit/hsplit work.
# stack acts as a "zoom/maximize this pane" toggle.
enabled_layouts                splits,stack,tall,grid

#: ── Pane borders / active-pane emphasis (Tilix dims inactive) ───
window_border_width            1pt
draw_minimal_borders           yes
active_border_color            #729fcf
inactive_border_color          #45484b
inactive_text_alpha            0.7
window_margin_width            0
window_padding_width           4
single_window_margin_width     0

#: ── Pages (Tilix "sessions") — tab strip across the top ─────────
# Always show the page strip, with a clickable [+] to add a page.
tab_bar_edge                   top
tab_bar_style                  powerline
tab_powerline_style            slanted
tab_bar_min_tabs               1
tab_bar_show_new_tab_button    yes
# Notification cue on the tab itself: {bell_symbol} still lights up when a
# program in the tab rings the bell; {activity_symbol} marks background output
# in an unfocused tab. Mirrors the per-pane title bars.
tab_title_template             "{index}: {fmt.fg.red}{bell_symbol}{fmt.fg.yellow}{activity_symbol}{fmt.fg.tab}{title}"
bell_on_tab                    "● "
tab_activity_symbol            "● "
# Kitty's stock tab colors (#eee active, #999 inactive, #444 text) sit close
# together and close to the bar itself, so on a fullscreen kiosk the page strip
# reads as one grey smear. Tango values instead: the strip is darker than the
# terminal so it reads as chrome, the active page is Tango blue, and inactive
# pages are Tango's dark grey with legible text — which also gives the slanted
# powerline separators two different colors to cut between.
tab_bar_background             #16181a
active_tab_background          #3465a4
active_tab_foreground          #ffffff
active_tab_font_style          bold
inactive_tab_background        #2e3436
inactive_tab_foreground        #b8bcb6
inactive_tab_font_style        normal

#: ── Tango palette (GNOME Terminal / Tilix default colors) ───────
background                     #1d1f21
foreground                     #d3d7cf
cursor                         #729fcf
selection_background           #3465a4
selection_foreground           #ffffff
# normal
color0  #2e3436
color1  #cc0000
color2  #4e9a06
color3  #c4a000
color4  #3465a4
color5  #75507b
color6  #06989a
color7  #d3d7cf
# bright
color8  #555753
color9  #ef2929
color10 #8ae234
color11 #fce94f
color12 #729fcf
color13 #ad7fa8
color14 #34e2e2
color15 #eeeeec

#: ── Misc feel ───────────────────────────────────────────────────
cursor_shape                   block
scrollback_lines               10000
enable_audio_bell              no
# no beep and no window-manager urgency request by default; keep the visible
# bell marker in the pane/tab chrome.
window_alert_on_bell           no
confirm_os_window_close        -1

#: ── Mouse (kilix fork) ─────────────────────────────────────────
# Right-click opens a clickable context menu (Copy / Paste / Select all /
# Clear selection). Both mouse-click and single-letter keys work. Remove this
# line to restore the default right-drag "extend selection" behavior.
mouse_map right press ungrabbed show_context_menu

# Full-screen TUIs (Claude Code, htop, …) grab the mouse, and grabbed mode
# hides the plain right-click menu above. Ctrl+Shift+right keeps the menu
# reachable there. Not shift+right: that is already extend-selection in both
# modes and stealing it would cost more than it buys. Plain right stays with
# the TUI — some of them use right-click themselves.
mouse_map ctrl+shift+right press grabbed show_context_menu

# Copy/paste between tabs with the mouse: selecting text copies it to the
# clipboard (so it pastes in any other tab, via the context menu or
# Ctrl+Shift+V), and a middle click pastes the highlighted selection.
copy_on_select clipboard
mouse_map middle release ungrabbed paste_from_selection

# In-terminal software mouse cursor: an inverse-video block on the cell under
# the pointer, drawn by kilix itself (the OS pointer is hidden over the grid).
# `block` (default) = gpm-style inverse cell, `pointer` = I-beam glyph,
# `none` = use the OS/compositor pointer. Especially useful under the plebian
# cage console where a themed OS pointer may be unavailable.
software_mouse_cursor          block

#: ── Remote control (needed for hosting graphical apps in overlays) ──
# Local remote control is on by default: requests arriving over the instance
# socket below are accepted unconditionally, so a bare `kitten @` (which finds
# the socket through KITTY_LISTEN_ON) works from any pane — including inside
# the kilix-95 and TUI desktops. The socket is reachable only from this
# machine. Requests arriving over the TTY — the route an SSH remote could
# reach — stay gated as before: passwordless fullscreen must target the
# requesting pane's own OS window, reload and font-size updates are narrowly
# permitted, and launch/list/focus/watch require the launcher's private
# runtime credential.
allow_remote_control           socket
remote_control_password        "" kilix_rc_auth.py
listen_on                      unix:@kilix-{kitty_pid}

#: ═══════════════════════════════════════════════════════════════
#: Keybindings — Tilix layout, mapped to kitty actions
#: ═══════════════════════════════════════════════════════════════

# Add panes (Tilix: Ctrl+Alt+R = right/side-by-side, Ctrl+Alt+D = down/stacked)
map ctrl+alt+r   launch --location=vsplit --cwd=current
map ctrl+alt+d   launch --location=hsplit --cwd=current
# generic split honoring the larger dimension
map ctrl+shift+enter launch --location=split --cwd=current

# Close the active pane (Tilix: Ctrl+Alt+W)
map ctrl+alt+w   kilix_close_persistent_window

# Focus panes by direction (Tilix: Alt+Arrows)
map alt+left     neighboring_window left
map alt+right    neighboring_window right
map alt+up       neighboring_window up
map alt+down     neighboring_window down

# Resize the active pane. This used to be Ctrl+Shift+Arrows, but that cluster
# is kitty's own default for page switching and scrolling, and switching pages
# is by far the more frequent operation — so resize moved to kitty's built-in
# interactive resize mode: Ctrl+Shift+R, then arrows (repeat freely), Enter to
# keep or Esc to cancel. Also reachable as Ctrl+Shift+B r below.
map ctrl+shift+home    resize_window reset

# Move/swap the active pane within the layout
map ctrl+alt+left      move_window left
map ctrl+alt+right     move_window right
map ctrl+alt+up        move_window up
map ctrl+alt+down      move_window down

# Zoom/maximize the active pane (toggle the stack layout)
map ctrl+alt+z   toggle_layout stack

# Broadcast input to every pane of the current page (Tilix "synchronize input").
# Opens an overlay you type into; keystrokes mirror to the page's panes. Ctrl+Esc exits.
map ctrl+alt+b   launch --type=overlay --allow-remote-control --window-title BROADCAST kitty +kitten broadcast --match-tab state:focused
map ctrl+alt+m   kilix_show_start_menu

# Pages — Tilix "sessions", one page of panes per kitty tab.
# Tilix defaults: Ctrl+Shift+T new, Ctrl+Shift+Q close, Ctrl+PgUp/PgDn
# switch, Ctrl+Shift+PgUp/PgDn reorder, Ctrl+Alt+1..0 jump to page N,
# F12 session sidebar (here: kitty's visual tab chooser).
map ctrl+shift+t new_tab_with_cwd
map ctrl+shift+q close_tab
map ctrl+page_up   previous_tab
map ctrl+page_down next_tab
# Ctrl+Shift+Arrows: kitty's stock cluster, restored. Left/right switch pages
# (Konsole and stock kitty agree); up/down scroll the pane by a line.
map ctrl+shift+left    previous_tab
map ctrl+shift+right   next_tab
map ctrl+shift+up      scroll_line_up smooth
map ctrl+shift+down    scroll_line_down smooth
map ctrl+shift+page_up   move_tab_backward
map ctrl+shift+page_down move_tab_forward
map ctrl+alt+1 goto_tab 1
map ctrl+alt+2 goto_tab 2
map ctrl+alt+3 goto_tab 3
map ctrl+alt+4 goto_tab 4
map ctrl+alt+5 goto_tab 5
map ctrl+alt+6 goto_tab 6
map ctrl+alt+7 goto_tab 7
map ctrl+alt+8 goto_tab 8
map ctrl+alt+9 goto_tab 9
map ctrl+alt+0 goto_tab 10
# The page/pane switcher (kilix-switch). kitty's own choosers are a numbered
# list of titles, which is least useful exactly when there are enough windows to
# need one; this shows the tree with each pane's process, directory and live
# screen. It falls back to a readable message if the tool is not installed, so
# F12 never opens an overlay that vanishes without saying why.
map f12 launch --type=overlay --cwd=current kilix switch --scope all
map f2  set_tab_title
# Content-only fullscreen: the fork hides both the page strip and clickable
# pane title chrome until F11 restores the normal window.
map f11 toggle_fullscreen

# Next/previous pane within a page (Tilix: Ctrl+Tab / Ctrl+Shift+Tab)
map ctrl+tab       next_window
map ctrl+shift+tab previous_window

# New OS window (Tilix: Ctrl+Shift+N)
map ctrl+shift+n new_os_window_with_cwd

# Cycle split orientation / layouts
map ctrl+alt+l   next_layout

#: ═══════════════════════════════════════════════════════════════
#: tmux-style leader (Ctrl+Shift+B) — tmux's own key layout, one
#: modifier away
#: ═══════════════════════════════════════════════════════════════
# Deliberately NOT tmux's own Ctrl+B prefix: `kilix serve` / `attach` / `view`
# run a real tmux server (config/tmux.conf) whose prefix must reach it
# untouched, and Ctrl+B is readline's backward-char in every shell. Ctrl+Shift+B
# keeps the muscle memory while leaving both alone.
#
# Panes are tmux panes, pages are tmux windows. One key per press and the mode
# exits, as after a tmux prefix; an unrecognized key beeps and exits.
map --new-mode tmux --on-unknown end --on-action end ctrl+shift+b

# Panes — tmux: select-pane
map --mode tmux left      neighboring_window left
map --mode tmux right     neighboring_window right
map --mode tmux up        neighboring_window up
map --mode tmux down      neighboring_window down
map --mode tmux o         next_window
map --mode tmux ;         nth_window -1
map --mode tmux q         launch --type=overlay --cwd=current kilix switch --scope page
map --mode tmux z         toggle_layout stack
map --mode tmux x         kilix_close_persistent_window
map --mode tmux {         move_window_backward
map --mode tmux }         move_window_forward
map --mode tmux space     next_layout
map --mode tmux r         start_resizing_window
# tmux's " and % splits. " is spelled shift+apostrophe: a bare " would be
# swallowed by the shlex tokenizer that parses map's option flags.
map --mode tmux shift+apostrophe  launch --location=hsplit --cwd=current
map --mode tmux %                 launch --location=vsplit --cwd=current

# Pages — tmux: windows
map --mode tmux c         new_tab_with_cwd
map --mode tmux n         next_tab
map --mode tmux p         previous_tab
map --mode tmux l         goto_tab 0
map --mode tmux w         select_tab
map --mode tmux ,         set_tab_title
map --mode tmux &         close_tab
map --mode tmux 1         goto_tab 1
map --mode tmux 2         goto_tab 2
map --mode tmux 3         goto_tab 3
map --mode tmux 4         goto_tab 4
map --mode tmux 5         goto_tab 5
map --mode tmux 6         goto_tab 6
map --mode tmux 7         goto_tab 7
map --mode tmux 8         goto_tab 8
map --mode tmux 9         goto_tab 9

map --mode tmux esc       pop_keyboard_mode
