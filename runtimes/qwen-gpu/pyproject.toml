[project]
name = "kilix-qwen-tts-gpu-runtime"
version = "0.2.2"
requires-python = ">=3.13,<3.14"
dependencies = [
  "qwen-tts==0.1.1",
  "torch==2.6.0+cu124",
  "torchaudio==2.6.0+cu124",
  "transformers==4.57.3",
  "accelerate==1.12.0",
  "flash-attn @ https://github.com/Dao-AILab/flash-attention/releases/download/v2.7.4.post1/flash_attn-2.7.4.post1%2Bcu12torch2.6cxx11abiFALSE-cp313-cp313-linux_x86_64.whl",
]

[tool.uv]
package = false
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]

[tool.uv.sources]
torch = { index = "pytorch-cu124" }
torchaudio = { index = "pytorch-cu124" }

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true
