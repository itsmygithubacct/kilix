name: X11 logger diagnostic
on: [push, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Install X11 fixture dependencies
        run: |
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            printf '%s\n' 'https://archive.ubuntu.com/ubuntu' | sudo tee /etc/apt/apt-mirrors.txt >/dev/null
          fi
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends python3-xlib xvfb xauth openbox
      - name: Repeat native window logger checks
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          for attempt in 1 2 3 4 5; do
            python3 -B -m unittest discover -s tests -p test_native_window_log.py -v
          done
