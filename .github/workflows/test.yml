name: test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Check out pinned sources and fork
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          submodules: recursive
          persist-credentials: false

      - name: Install test-only OS packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ffmpeg python3-pil python3-xlib shellcheck xvfb xauth openbox dbus-daemon tmux \
            libsamplerate0-dev libssl-dev python3-dbus polkitd

      - name: Allow unprivileged user namespaces for the X11 sandbox tests
        # tests/x11_sandbox.py and the path-guard tests enter a private
        # user/mount/network namespace. Ubuntu 24.04 runners restrict that
        # through AppArmor, which surfaces as EACCES on /proc/self/ns/net and
        # /proc/self/setgroups; Debian, the platform these tests target,
        # does not restrict it.
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Check shell and Python syntax
        run: |
          bash -n kilix bootstrap.sh build.sh config/browser.sh \
            scripts/build-state-library.sh \
            scripts/kilix-telemetry.sh \
            scripts/install-build-deps.sh scripts/install-kilix-cap.sh \
            scripts/install-kilix-bonsai.sh scripts/install-kilix-voice.sh \
            scripts/install-kilix-vibeasr.sh scripts/install-kilix-whisper-stt.sh scripts/install-kilix-whistle.sh \
            scripts/build-multiplexer.sh
          shellcheck -S warning -x kilix bootstrap.sh build.sh \
            config/browser.sh \
            scripts/kilix-telemetry.sh \
            scripts/build-state-library.sh scripts/install-build-deps.sh \
            scripts/install-kilix-cap.sh scripts/install-kilix-bonsai.sh \
            scripts/install-kilix-voice.sh scripts/install-kilix-vibeasr.sh \
            scripts/install-kilix-whisper-stt.sh scripts/install-kilix-whistle.sh scripts/build-multiplexer.sh
          python3 -m compileall -q config desktop scripts tests third_party/kilix-state/python/src third_party/kilix-state/python/tests third_party/kilix-telemetry/src third_party/kitty-frame-presenter/src third_party/kilix-transcript-clean/src
          git diff --check "$(git hash-object -t tree /dev/null)" HEAD -- . ':(exclude)src'

      - name: Fetch the exact Qwen provider for preparation fixtures
        run: |
          ref="$(sed -n "s/^PROVIDER_REF = '\([0-9a-f]\{40\}\)'$/\1/p" config/kilix_sdk/qwen_provider.py)"
          [[ "$ref" =~ ^[0-9a-f]{40}$ ]] || exit 1
          source_dir="$RUNNER_TEMP/kilix-qwen-provider"
          git init -q "$source_dir"
          git -C "$source_dir" fetch -q --depth=1 \
            https://github.com/itsmygithubacct/kilix-qwen-tts.git "$ref"
          git -C "$source_dir" checkout -q --detach "$ref"
          printf 'KILIX_QWEN_PROVIDER_TEST_SOURCE=%s\n' "$source_dir" >> "$GITHUB_ENV"

      - name: Fetch pinned shared-source and distribution fixtures
        run: |
          fixture_root="$RUNNER_TEMP/kilix-fixtures"
          mkdir -m 700 "$fixture_root"
          fetch_fixture() {
            repo="$1" ref="$2" variable="$3"
            destination="$fixture_root/$repo"
            git init -q "$destination"
            git -C "$destination" fetch -q --depth=1 "https://github.com/itsmygithubacct/$repo.git" "$ref"
            git -C "$destination" checkout -q --detach "$ref"
            chmod 700 "$destination"
            printf '%s=%s\n' "$variable" "$destination" >> "$GITHUB_ENV"
          }
          fetch_fixture kilix-voice 5f187ba19c7d21263e40cec2e9a2fa878c2f805a KILIX_VOICE_TEST_SOURCE
          fetch_fixture kilix-system-monitor 849e35051eee81e1ad11c9b00236597409c835dd KILIX_DEVICE_LEASE_TEST_SOURCE
          fetch_fixture pleb 9420e7a0a8cfd63584b4f42b383ca9bae0786f33 KILIX_PLEB_TEST_SOURCE
          fetch_fixture plebian-os 1b190a62c535163f3c424c8dcf4ab6469c08a419 KILIX_OS_TEST_SOURCE

      - name: Run host tests
        run: |
          export KILIX_STORAGE_HOME="$RUNNER_TEMP/kilix-storage"
          export KILIX_BUILD_DIRECTORY="$KILIX_STORAGE_HOME/build"
          export KILIX_STATE_LIBRARY="$KILIX_BUILD_DIRECTORY/libraries/kilix-state/libkilix-state.so"
          ./scripts/build-state-library.sh
          make --no-print-directory -C third_party/kilix-state BUILD_DIR="$RUNNER_TEMP/kilix-state-test" test
          PYTHONPATH=third_party/kilix-state/python/src \
            python3 -m unittest discover -s third_party/kilix-state/python/tests -p 'test_*.py'
          PYTHONPATH=third_party/kilix-telemetry/src \
            python3 -m unittest discover -s third_party/kilix-telemetry/tests -p 'test_*.py'
          PYTHONPATH=third_party/kilix-transcript-clean/src:third_party/kilix-transcript-clean/tests \
            python3 -m unittest discover -s third_party/kilix-transcript-clean/tests -p 'test_*.py'
          python3 -m unittest discover -s tests -p 'test_*.py'
          python3 -m unittest discover -s third_party/kitty-frame-presenter/tests -p 'test_*.py'

      - name: Run desktop tests
        run: |
          for test_file in desktop/tests/test_*.py; do
            python3 "$test_file"
          done

      - name: Retain private-bus service diagnostics
        if: failure()
        run: sudo journalctl --since '30 minutes ago' -u 'kilix-private-bus-*' --no-pager -n 200

  private-bus:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Install integration prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends python3-dbus python3-pil python3-xlib dbus-daemon polkitd
          # Hosted images make /usr/share writable to their runner group.
          # The installed service requires the distribution's root-owned,
          # non-writable parent chain, including its authorization rules.
          sudo chown root:root /usr/share /usr/share/polkit-1 /usr/share/polkit-1/rules.d
          sudo chmod go-w /usr/share /usr/share/polkit-1 /usr/share/polkit-1/rules.d
          sudo /usr/bin/python3 -B tests/test_private_bus_installer.py -v
          sudo bash -c 'umask 077; exec /usr/bin/python3 scripts/install-private-bus-supervisor.py --install'
      - name: Exercise installed private-bus ownership
        run: |
          fixture_home="$RUNNER_TEMP/private-bus-home"
          mkdir -m 700 "$fixture_home"
          env -i HOME="$fixture_home" PATH=/usr/bin:/bin LANG=C.UTF-8 \
            TMPDIR="$RUNNER_TEMP" PYTHONDONTWRITEBYTECODE=1 \
            KILIX_REQUIRE_PRIVATE_BUS_TESTS=1 \
            python3 -m unittest discover -s tests -p test_private_bus.py -v
      - name: Retain private-bus service diagnostics
        if: failure()
        run: sudo journalctl --since '15 minutes ago' -u 'kilix-private-bus-*' --no-pager -n 200
