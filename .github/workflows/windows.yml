name: Windows preview

on:
  push:
    branches: [main, work/windows-0.2.2]
    tags: ['windows-v*-preview.*']
    paths: ['windows/**', 'config/**', 'src', '.github/workflows/windows.yml']
  pull_request:
    paths: ['windows/**', 'config/**', 'src', '.github/workflows/windows.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  companion:
    name: Linux companion regressions
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - run: python3 -m unittest discover -s windows/tests -p 'test_wsl*.py'

  games:
    name: Build the pinned public game catalog
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Fetch exact companion sources
        shell: python
        run: |
          import json, os, pathlib, subprocess
          pins = json.loads(pathlib.Path('windows/wsl/source-revisions.json').read_text())
          root = pathlib.Path(os.environ['RUNNER_TEMP']) / 'companion-sources'
          repositories = {'needle': 'kilix-needle', 'games': 'kilix-games',
                          'super-kilix': 'super-kilix', 'kilix-land': 'kilix-land',
                          'pleb-plant-grower': 'pleb-plant-grower'}
          for name, repository in repositories.items():
              target = root / name
              subprocess.run(['git', 'clone', '--no-checkout',
                              'https://github.com/itsmygithubacct/' + repository + '.git', str(target)], check=True)
              subprocess.run(['git', '-C', str(target), 'checkout', '--detach', pins[name]], check=True)
              subprocess.run(['git', '-C', str(target), 'submodule', 'update', '--init', '--recursive'], check=True)
      - name: Export and install all games
        run: |
          set -euo pipefail
          source_root="$RUNNER_TEMP/companion-sources"
          python3 windows/wsl/bundle.py --needle "$source_root/needle" --games "$source_root/games" \
            --super-kilix "$source_root/super-kilix" --kilix-land "$source_root/kilix-land" \
            --plant-grower "$source_root/pleb-plant-grower" --output "$RUNNER_TEMP/companion.tar.gz"
          digest=$(sha256sum "$RUNNER_TEMP/companion.tar.gz")
          python3 windows/wsl/setup.py "$RUNNER_TEMP/companion.tar.gz" "${digest%% *}"
          python3 windows/tests/check-games.py --output "$RUNNER_TEMP/game-checks.json"

  windows:
    name: Native Windows build and CLI
    runs-on: windows-2022
    timeout-minutes: 60
    defaults:
      run:
        shell: powershell
    steps:
      - name: Preserve script line endings
        run: git config --global core.autocrlf false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          # Native packaging needs only the pinned engine, not Linux services.
          submodules: false
      - name: Fetch the pinned engine
        run: |
          git submodule update --init src
          if ($LASTEXITCODE -ne 0) { throw 'Engine checkout failed' }
      - name: Provision isolated toolchain
        run: .\windows\provision-engine-toolchain.ps1
      - name: Build portable application
        run: .\windows\package.ps1
      - name: Check packaged command interface
        run: .\windows\test-cli.ps1 -ApplicationDirectory .\src\dist\kilix
      - name: Record source and checksums
        run: |
          python .\windows\export-source.py --output .\src\dist
          if ($LASTEXITCODE -ne 0) { throw 'Source export failed' }
          Copy-Item "$env:USERPROFILE\kilix-build\toolchain-packages.txt" .\src\dist\toolchain-packages.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: kilix-windows-x64-${{ github.sha }}
          if-no-files-found: error
          retention-days: 30
          path: |
            src/dist/kilix-0.2.2-windows-x64-dev.zip
            src/dist/kilix-0.2.2-windows-source.tar.gz
            src/dist/SHA256SUMS
            src/dist/source-revisions.json
            src/dist/toolchain-packages.txt

  preview:
    name: Prepare Windows preview release
    if: startsWith(github.ref, 'refs/tags/windows-v')
    needs: [companion, games, windows]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: kilix-windows-x64-${{ github.sha }}
          path: preview
      - name: Create draft prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          GH_REPO: ${{ github.repository }}
        run: |
          cat > "$RUNNER_TEMP/notes.txt" <<'NOTES'
          Native Windows x64 preview with PowerShell, Command Prompt and optional WSL profiles.

          Includes the WSL control companion; Needle and game dependencies install separately.
          Hosted CI checks compilation and CLI behavior. Desktop, GPU and WSL integration
          require the separate interactive hardware tests before publication.
          Extract the complete ZIP. Source, exact revisions and SHA256 checksums are attached.
          NOTES
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            test "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" = true
            gh release upload "$RELEASE_TAG" preview/* --clobber
          else
            gh release create "$RELEASE_TAG" preview/* --verify-tag --draft --prerelease \
              --title "Kilix $RELEASE_TAG" --notes-file "$RUNNER_TEMP/notes.txt"
          fi
